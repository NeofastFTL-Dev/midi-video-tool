name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still asks for the retired
          # "tools" package, which makes sdkmanager fail.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          ver=$(grep -m1 "versionName" app/build.gradle | sed "s/.*versionName '\([^']*\)'.*/\1/")
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${ver}" >&2
            exit 1
          fi
          echo "Releasing version ${ver}"

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build debug + release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          ver=$(grep -m1 "versionName" app/build.gradle | sed "s/.*versionName '\([^']*\)'.*/\1/")
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/midi-video-generator-${ver}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/midi-video-generator-${ver}.apk"
          else
            # No signing secrets configured: publish the unsigned build so the
            # artifact still exists, under an obvious name.
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               "dist/midi-video-generator-${ver}-unsigned.apk"
          fi
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: midi-video-generator-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: midi-video-generator-apk
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          files=$(ls dist/*.apk)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "MIDI Video Generator $GITHUB_REF_NAME" \
              --generate-notes
          fi
