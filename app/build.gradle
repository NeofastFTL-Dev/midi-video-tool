plugins {
    id 'com.android.application'
}

// Release signing is opt-in: CI injects a keystore path + passwords through the
// environment, and a local build simply produces an unsigned release APK.
// Nothing secret is ever read from (or written to) the repository.
def keystorePath = System.getenv('KEYSTORE_FILE')
def hasKeystore = keystorePath != null && !keystorePath.trim().isEmpty() && file(keystorePath).exists()

android {
    namespace 'com.neofastftl.midivideogen'
    compileSdk 35

    defaultConfig {
        applicationId 'com.neofastftl.midivideogen'
        // 29 (Android 10): the app writes through MediaStore/SAF only, so it
        // needs no storage permissions at all.
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
